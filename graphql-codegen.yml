overwrite: true
schema:
  - './apps/club-service/graphql-gql/schema/**/*.ts'

documents:
  - './apps/club-dash/app/_hooks/graphql/**/*.graphql'

generates:
  ./apps/club-dash/app/_hooks/generated/graphql.ts:
    plugins:
      - 'typescript'
      - 'typescript-operations'
      - 'typed-document-node'
config:
  reactApolloVersion: 3
  withHooks: true
  apolloReactHooksImportFrom: '@apollo/client/react'
